name: Windows Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build release artifact
        shell: pwsh
        run: .\scripts\build.ps1 -Target release -Clean

      - name: Run analysis pipeline
        shell: pwsh
        run: .\scripts\build.ps1 -Target dumps -Clean

      - name: Upload build and analysis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          if-no-files-found: warn
          path: |
            build/test.exe
            build/test.obj
            build/test.pdb
            build/test.ilk
            analysis/objdump/*.txt
            analysis/hexdump/*.txt
            analysis/ghidra/ghidra-test.gpr
            analysis/ghidra/ghidra-test.rep/**